<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miamitech.ai — Community Concierge & Index</title>
  <meta name="description"
    content="The AI concierge and index for the Miami tech and startup ecosystem. Discover investors, coworking spaces, ambassadors, news sources, and more." />
  <link rel="canonical" href="https://miamitech.ai" />
  <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)" />

  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark'; // Always default to dark mode, override if user explicitly saved 'light'
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://miamitech.ai" />
  <meta property="og:title" content="miamitech.ai — Community Concierge & Index" />
  <meta property="og:description"
    content="The AI concierge and index for the Miami tech and startup ecosystem. Discover investors, coworking spaces, ambassadors, news sources, and more." />
  <meta property="og:image" content="https://miamitech.ai/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="miamitech.ai" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

    content="The AI concierge and index for the Miami tech and startup ecosystem. Discover investors, coworking spaces, ambassadors, news sources, and more." />
  <meta name="twitter:image" content="https://miamitech.ai/og-image.png" />
</head>

</html>
